name: Source acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: Windows source acceptance
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore dependencies
        run: |
          python -m pip install -r requirements-build.txt
          npm ci
      - name: Tests and full desktop / launcher build
        run: python scripts/build/workbench.py build --no-activate
      - name: Native Workbench tests
        run: cargo test --manifest-path app/desktop/src-tauri/Cargo.toml --bins
      - name: Native launcher and dispatcher tests
        run: cargo test --manifest-path app/launcher/src-tauri/Cargo.toml --bins
