name: Source acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Windows source acceptance
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use one Windows temporary path
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP bio-tests
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          'TEMP=' + $scratch >> $env:GITHUB_ENV
          'TMP=' + $scratch >> $env:GITHUB_ENV

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/desktop/src-tauri/target
            app/launcher/src-tauri/target
          key: windows-rust-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: windows-rust-

      - name: Restore dependencies
        run: |
          python -m pip install -r requirements-build.txt
          npm ci

      - name: Tests and full desktop / launcher build
        run: python scripts/build/workbench.py build --no-activate

      - name: Native Workbench tests
        run: cargo test --manifest-path app/desktop/src-tauri/Cargo.toml --release --bins

      - name: Native launcher and dispatcher tests
        run: cargo test --manifest-path app/launcher/src-tauri/Cargo.toml --release --bins
