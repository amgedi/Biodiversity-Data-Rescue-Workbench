name: Source acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Windows source acceptance
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Use one Windows temporary path
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP bio-tests
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          'TEMP=' + $scratch >> $env:GITHUB_ENV
          'TMP=' + $scratch >> $env:GITHUB_ENV

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/desktop/src-tauri/target
            app/launcher/src-tauri/target
          key: windows-rust-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: windows-rust-

      - name: Restore dependencies
        run: |
          python -m pip install -r requirements-build.txt
          npm ci

      - name: Tests and full desktop / launcher build
        run: python scripts/build/workbench.py build --no-activate

      - name: Native Workbench tests
        run: cargo test --manifest-path app/desktop/src-tauri/Cargo.toml --release --bins

      - name: Native launcher and dispatcher tests
        run: cargo test --manifest-path app/launcher/src-tauri/Cargo.toml --release --bins
