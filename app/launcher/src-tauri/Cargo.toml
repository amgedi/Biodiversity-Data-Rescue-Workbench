[package]
default-run = "workbench-launcher"
name = "workbench-launcher"
version = "0.7.0-dev.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-single-instance = "2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = {version="0.61",features= ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation"] }

windows = {version="0.62.2",features=["Win32_Foundation","Win32_UI_Shell_PropertiesSystem","Win32_System_Com_StructuredStorage","Win32_System_Variant"]}

reqwest = { version="0.13.5", default-features=false, features=["rustls","json"] }
semver = "1.0.28"

[features]
custom-protocol = ["tauri/custom-protocol"]
